<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="ga-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c120e" />
      <stop offset="100%" stop-color="#141c17" />
    </linearGradient>
    <linearGradient id="ga-curve" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="ga-users" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#ga-bg)" stroke="#223028" stroke-width="2" />

  <!-- Top bar -->
  <g transform="translate(32, 28)">
    <rect width="36" height="36" rx="8" fill="#1e293b" />
    <!-- Bar chart GA icon -->
    <rect x="10" y="20" width="4" height="8" rx="1" fill="#f59e0b" />
    <rect x="16" y="14" width="4" height="14" rx="1" fill="#f59e0b" />
    <circle cx="24" cy="18" r="3" fill="#f59e0b" />
    <text x="48" y="16" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Google Analytics (GA4)</text>
    <text x="48" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Organic Search Acquisition, Active Users &amp; Sessions</text>
    <rect x="620" y="4" width="116" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" />
    <text x="678" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">GA4 Verified</text>
  </g>

  <!-- Metric boxes -->
  <g transform="translate(32, 85)">
    <!-- Box 1: Users -->
    <rect width="170" height="68" rx="10" fill="#121815" stroke="#223028" stroke-width="1" />
    <text x="16" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">ACTIVE USERS</text>
    <text x="16" y="52" fill="#10b981" font-family="system-ui, sans-serif" font-size="22" font-weight="800">14.8K</text>
    <text x="92" y="50" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">▲ +310%</text>

    <!-- Box 2: Sessions -->
    <rect x="185" width="170" height="68" rx="10" fill="#121815" stroke="#223028" stroke-width="1" />
    <text x="201" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">ORGANIC SESSIONS</text>
    <text x="201" y="52" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="22" font-weight="800">22.4K</text>
    <text x="280" y="50" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">▲ +420%</text>

    <!-- Box 3: Engagement Rate -->
    <rect x="370" width="170" height="68" rx="10" fill="#121815" stroke="#223028" stroke-width="1" />
    <text x="386" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">ENGAGEMENT RATE</text>
    <text x="386" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">62.8%</text>
    <text x="460" y="50" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">▲ +12%</text>

    <!-- Box 4: Event Count -->
    <rect x="555" width="181" height="68" rx="10" fill="#121815" stroke="#223028" stroke-width="1" />
    <text x="571" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">KEY CONVERSIONS</text>
    <text x="571" y="52" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="22" font-weight="800">1,820</text>
    <text x="640" y="50" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">▲ +245%</text>
  </g>

  <!-- Area Chart -->
  <g transform="translate(32, 175)">
    <rect width="736" height="210" rx="10" fill="#0f1512" stroke="#1f2923" stroke-width="1" />
    
    <!-- Grid -->
    <line x1="20" y1="50" x2="716" y2="50" stroke="#1a231e" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="20" y1="105" x2="716" y2="105" stroke="#1a231e" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="20" y1="155" x2="716" y2="155" stroke="#1a231e" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Organic curve -->
    <path d="M 20 175 Q 160 165 240 145 T 420 100 T 580 60 T 716 30 L 716 195 L 20 195 Z" fill="url(#ga-users)" />
    <path d="M 20 175 Q 160 165 240 145 T 420 100 T 580 60 T 716 30" fill="none" stroke="#10b981" stroke-width="3" />
    <circle cx="716" cy="30" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Upload Prompt / Placeholder Banner -->
  <g transform="translate(32, 405)">
    <rect width="736" height="50" rx="8" fill="#161f1a" stroke="#223028" stroke-width="1" />
    <circle cx="32" cy="25" r="14" fill="#10b981" fill-opacity="0.15" />
    <path d="M26 27l4-4 4 4M30 23v7" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Image Placeholder: Google Analytics (GA4) Screenshot</text>
    <text x="60" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Replace file at: <tspan fill="#34d399" font-family="monospace">/images/case-studies/google-analytics.png</tspan></text>
  </g>
</svg>
