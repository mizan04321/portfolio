<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="leads-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c120e" />
      <stop offset="100%" stop-color="#141c17" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#leads-bg)" stroke="#223028" stroke-width="2" />

  <!-- Top bar -->
  <g transform="translate(32, 28)">
    <rect width="36" height="36" rx="8" fill="#1e293b" />
    <!-- Target / Crosshair icon -->
    <circle cx="18" cy="18" r="9" fill="none" stroke="#10b981" stroke-width="2" />
    <circle cx="18" cy="18" r="4" fill="#10b981" />
    <text x="48" y="16" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Leads, Inquiries &amp; Customer Acquisition</text>
    <text x="48" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Direct Phone Calls, Booking Forms &amp; Inbound Messages</text>
    <rect x="620" y="4" width="116" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" />
    <text x="678" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Client Confirmed</text>
  </g>

  <!-- Metric boxes -->
  <g transform="translate(32, 85)">
    <!-- Box 1: Total Leads -->
    <rect width="232" height="72" rx="10" fill="#121815" stroke="#223028" stroke-width="1" />
    <text x="16" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">QUALIFIED INBOUND LEADS</text>
    <text x="16" y="56" fill="#10b981" font-family="system-ui, sans-serif" font-size="24" font-weight="800">1,530+</text>
    <text x="115" y="54" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">▲ High Intent</text>

    <!-- Box 2: Conversion Rate -->
    <rect x="252" width="232" height="72" rx="10" fill="#121815" stroke="#223028" stroke-width="1" />
    <text x="268" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">CONVERSION RATE</text>
    <text x="268" y="56" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="24" font-weight="800">18.4%</text>
    <text x="350" y="54" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">▲ +6.2%</text>

    <!-- Box 3: Cost Per Acquisition -->
    <rect x="504" width="232" height="72" rx="10" fill="#121815" stroke="#223028" stroke-width="1" />
    <text x="520" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">ORGANIC CAC REDUCTION</text>
    <text x="520" y="56" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="24" font-weight="800">-64%</text>
    <text x="585" y="54" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">▼ Saved Ad Spend</text>
  </g>

  <!-- Recent Leads Stream Visualizer -->
  <g transform="translate(32, 180)">
    <rect width="736" height="205" rx="10" fill="#0f1512" stroke="#1f2923" stroke-width="1" />
    <text x="20" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Verified Inbound Lead Activity Feed</text>

    <!-- Lead row 1 -->
    <g transform="translate(20, 42)">
      <rect width="696" height="40" rx="8" fill="#141c17" stroke="#223028" />
      <circle cx="20" cy="20" r="10" fill="#10b981" fill-opacity="0.2" />
      <path d="M16 20l2 2 5-5" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="40" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Phone Call (Google Maps Mobile Click-to-Call)</text>
      <text x="380" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Duration: 4m 18s · Prescription Order Inquiry</text>
      <text x="640" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Converted</text>
    </g>

    <!-- Lead row 2 -->
    <g transform="translate(20, 92)">
      <rect width="696" height="40" rx="8" fill="#141c17" stroke="#223028" />
      <circle cx="20" cy="20" r="10" fill="#10b981" fill-opacity="0.2" />
      <path d="M16 20l2 2 5-5" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="40" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Direct Booking Appointment Form</text>
      <text x="380" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Oldham Clinic · Diabetic Foot Assessment</text>
      <text x="640" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Converted</text>
    </g>

    <!-- Lead row 3 -->
    <g transform="translate(20, 142)">
      <rect width="696" height="40" rx="8" fill="#141c17" stroke="#223028" />
      <circle cx="20" cy="20" r="10" fill="#60a5fa" fill-opacity="0.2" />
      <path d="M16 20l2 2 5-5" stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round" />
      <text x="40" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Commercial Landscaping Quote Request</text>
      <text x="380" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Houston, TX · $4,500 Seasonal Lawn Contract</text>
      <text x="640" y="24" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Closed Deal</text>
    </g>
  </g>

  <!-- Upload Prompt / Placeholder Banner -->
  <g transform="translate(32, 405)">
    <rect width="736" height="50" rx="8" fill="#161f1a" stroke="#223028" stroke-width="1" />
    <circle cx="32" cy="25" r="14" fill="#10b981" fill-opacity="0.15" />
    <path d="M26 27l4-4 4 4M30 23v7" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Image Placeholder: Leads &amp; Inquiries Screenshot</text>
    <text x="60" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Replace file at: <tspan fill="#34d399" font-family="monospace">/images/case-studies/leads.png</tspan></text>
  </g>
</svg>
