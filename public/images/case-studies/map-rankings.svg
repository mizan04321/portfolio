<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="map-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c120e" />
      <stop offset="100%" stop-color="#141c17" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#map-bg)" stroke="#223028" stroke-width="2" />

  <!-- Top bar -->
  <g transform="translate(32, 28)">
    <rect width="36" height="36" rx="8" fill="#1e293b" />
    <!-- Map compass icon -->
    <circle cx="18" cy="18" r="9" fill="none" stroke="#10b981" stroke-width="2" />
    <polygon points="18,12 21,21 18,18 15,21" fill="#10b981" />
    <text x="48" y="16" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Map Rankings &amp; Geo-Grid Heatmap</text>
    <text x="48" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Local Falcon · Google Maps 3-Pack Dominance (13x13 Grid)</text>
    <rect x="620" y="4" width="116" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" />
    <text x="678" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">#1 Top Ranked</text>
  </g>

  <!-- Geo-Grid Simulated Map Canvas -->
  <g transform="translate(32, 85)">
    <rect width="736" height="300" rx="12" fill="#0f1512" stroke="#1f2923" stroke-width="1" />
    
    <!-- Street grid lines -->
    <path d="M 0 60 Q 200 80 400 50 T 736 70" stroke="#1e2922" stroke-width="3" fill="none" />
    <path d="M 0 160 Q 300 130 500 180 T 736 150" stroke="#1e2922" stroke-width="4" fill="none" />
    <path d="M 0 240 Q 250 220 450 260 T 736 230" stroke="#1e2922" stroke-width="2" fill="none" />
    <path d="M 160 0 Q 180 150 150 300" stroke="#1e2922" stroke-width="3" fill="none" />
    <path d="M 380 0 Q 360 140 390 300" stroke="#1e2922" stroke-width="5" fill="none" />
    <path d="M 580 0 Q 600 160 570 300" stroke="#1e2922" stroke-width="3" fill="none" />

    <!-- Center Business Hub Marker -->
    <circle cx="368" cy="150" r="18" fill="#10b981" fill-opacity="0.25" />
    <circle cx="368" cy="150" r="8" fill="#10b981" />
    <circle cx="368" cy="150" r="3" fill="#ffffff" />

    <!-- 5x5 Geo-Grid Ranking Pins (All dominant 1s and 2s) -->
    <!-- Row 1 -->
    <g transform="translate(180, 45)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(275, 45)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(368, 45)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(460, 45)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(550, 45)"><circle cx="0" cy="0" r="13" fill="#34d399"/><text x="0" y="4" fill="#0b0f0d" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2</text></g>

    <!-- Row 2 -->
    <g transform="translate(180, 95)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(275, 95)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(368, 95)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(460, 95)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(550, 95)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>

    <!-- Row 3 (Center Row) -->
    <g transform="translate(180, 150)"><circle cx="0" cy="0" r="13" fill="#34d399"/><text x="0" y="4" fill="#0b0f0d" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2</text></g>
    <g transform="translate(275, 150)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <!-- Center (368, 150) is the hub -->
    <g transform="translate(460, 150)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(550, 150)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>

    <!-- Row 4 -->
    <g transform="translate(180, 205)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(275, 205)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(368, 205)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(460, 205)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(550, 205)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>

    <!-- Row 5 -->
    <g transform="translate(180, 255)"><circle cx="0" cy="0" r="13" fill="#34d399"/><text x="0" y="4" fill="#0b0f0d" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2</text></g>
    <g transform="translate(275, 255)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(368, 255)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(460, 255)"><circle cx="0" cy="0" r="13" fill="#10b981"/><text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text></g>
    <g transform="translate(550, 255)"><circle cx="0" cy="0" r="13" fill="#fbbf24"/><text x="0" y="4" fill="#0b0f0d" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">3</text></g>

    <!-- Stats badge on map -->
    <g transform="translate(20, 20)">
      <rect width="130" height="45" rx="8" fill="#121815" fill-opacity="0.9" stroke="#223028" />
      <text x="12" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">AVG GRID RANK</text>
      <text x="12" y="36" fill="#10b981" font-family="system-ui, sans-serif" font-size="16" font-weight="800">#1.16</text>
    </g>
  </g>

  <!-- Upload Prompt / Placeholder Banner -->
  <g transform="translate(32, 405)">
    <rect width="736" height="50" rx="8" fill="#161f1a" stroke="#223028" stroke-width="1" />
    <circle cx="32" cy="25" r="14" fill="#10b981" fill-opacity="0.15" />
    <path d="M26 27l4-4 4 4M30 23v7" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Image Placeholder: Map Rankings / Local Falcon Screenshot</text>
    <text x="60" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Replace file at: <tspan fill="#34d399" font-family="monospace">/images/case-studies/map-rankings.png</tspan></text>
  </g>
</svg>
